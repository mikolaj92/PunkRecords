[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "punkrecords"
version = "0.1.0"
description = "PunkRecords plugin-based multi-account OAuth proxy runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "app-factory[platform]",
  "fastapi==0.135.2",
  "jinja2==3.1.6",
  "my-auth[fastapi-htmx]",
  "my-usermanager[fastapi-htmx,myauth]",
  "uvicorn==0.42.0",
]
authors = [
  { name = "Miko" }
]
keywords = ["proxy", "openai-compatible", "oauth", "providers", "cli"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[project.scripts]
punkrecords = "punkrecords.cli:main"

[tool.uv.sources]
# Platform BOM from app-factory COMPAT.md (latest row):
# app-factory v0.6.16 + my-auth v0.4.8 + my-usermanager v0.5.11
app-factory = { git = "https://github.com/mikolaj92/app-factory", tag = "v0.6.16" }
my-auth = { git = "https://github.com/mikolaj92/my-auth", tag = "v0.4.8" }
my-usermanager = { git = "https://github.com/mikolaj92/my-usermanager", tag = "v0.5.11" }

[tool.uv]
# Nested adapter uv.sources may declare an older app-factory. Override app-factory only.
# Do not override my-auth; the immutable BOM owns its nested pin.
override-dependencies = [
  "app-factory[platform]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
punkrecords = [
  "templates/*.html",
  "templates/partials/*.html",
  "templates/app_factory/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
