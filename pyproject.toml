[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "punkrecords"
version = "0.1.0"
description = "PunkRecords plugin-based multi-account OAuth proxy runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "app-factory[platform]",
  "fastapi>=0.141.1",
  "jinja2>=3.1.6",
  "my-auth[fastapi-htmx]",
  "my-usermanager[fastapi-htmx,myauth]",
  "starlette>=1.6.0",
  "uvicorn[standard]>=0.52.4",
]
authors = [
  { name = "Miko" }
]
keywords = ["proxy", "openai-compatible", "oauth", "providers", "cli"]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12.0",
  "pytest>=8",
]

[project.scripts]
punkrecords = "punkrecords.cli:main"

[tool.uv.sources]
# Platform BOM from app-factory COMPAT.md (latest row):
# app-factory v0.6.10 + my-auth v0.4.5 + my-usermanager v0.5.6
app-factory = { git = "https://github.com/mikolaj92/app-factory", tag = "v0.6.10" }
my-auth = { git = "https://github.com/mikolaj92/my-auth", tag = "v0.4.5" }
my-usermanager = { git = "https://github.com/mikolaj92/my-usermanager", tag = "v0.5.6" }

[tool.uv]
# Nested adapter uv.sources still declare app-factory@v0.6.6
# (UM v0.5.6 / my-auth v0.4.5). Override app-factory only. Do not
# override my-auth — UM v0.5.6 already nests my-auth@v0.4.5.
override-dependencies = [
  "app-factory[platform]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
punkrecords = [
  "templates/*.html",
  "templates/partials/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
