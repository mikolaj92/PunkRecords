[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "punkrecords"
version = "0.1.0"
description = "PunkRecords plugin-based multi-account OAuth proxy runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "app-factory[platform]",
  "fastapi==0.143.2",
  "jinja2==3.1.6",
  "my-auth[fastapi-htmx]",
  "my-usermanager[fastapi-htmx,myauth]",
  "uvicorn==0.54.0",
]
authors = [
  { name = "Miko" }
]
keywords = ["proxy", "openai-compatible", "oauth", "providers", "cli"]

[project.optional-dependencies]
dev = [
  "httpx2==2.13.1",
  "pytest>=8",
]

[project.scripts]
punkrecords = "punkrecords.cli:main"

[tool.uv.sources]
app-factory = { git = "https://github.com/mikolaj92/app-factory", tag = "v0.7.9" }
my-auth = { git = "https://github.com/mikolaj92/my-auth", tag = "v0.5.7" }
my-usermanager = { git = "https://github.com/mikolaj92/my-usermanager", tag = "v0.6.10" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
punkrecords = [
  "templates/*.html",
  "templates/partials/*.html",
  "templates/app_factory/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
